<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Of Brothers Admin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        text-align: center;
      }
      .brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .brand span {
        color: #f39200;
      }
      .msg {
        font-size: 14px;
        opacity: 0.6;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(243, 146, 0, 0.25);
        border-top-color: #f39200;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Of <span>Brothers</span></div>
      <div class="spinner"></div>
      <div class="msg">A ligar… verifica a tua ligação à internet.</div>
    </div>
  </body>
</html>
